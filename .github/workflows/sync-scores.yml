name: Sync Masters scores (every 5 min)

# Calls the auth-free /api/cron/sync-public endpoint every 5 minutes.
# No secrets required — the endpoint is protected by a date gate
# (April 7–15 only) and a 4-minute rate limit in the database.
#
# Outside Masters week every run returns {skipped:true} instantly.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:   # manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync scores
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://augusta-pool.vercel.app/api/cron/sync-public")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "HTTP $STATUS — $BODY"
          [ "$STATUS" -ge 500 ] && exit 1 || exit 0
